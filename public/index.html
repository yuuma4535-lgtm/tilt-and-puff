<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Google AdSense — site ownership + ads loader -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2605764921087854"
      crossorigin="anonymous"
    ></script>
    <!-- Open Graph / Twitter share preview -->
    <meta property="og:title" content="Tilt & Puff - 傾けて吸うジョークアプリ" />
    <meta
      property="og:description"
      content="スマホを傾けると、まるで本物のように吸える。iBeer風のノベルティアプリ。"
    />
    <meta property="og:image" content="https://tilt-and-puff.vercel.app/og-image.png" />
    <meta property="og:url" content="https://tilt-and-puff.vercel.app" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tilt & Puff - 傾けて吸うジョークアプリ" />
    <meta
      name="twitter:description"
      content="スマホを傾けると、まるで本物のように吸える。iBeer風のノベルティアプリ。"
    />
    <meta name="twitter:image" content="https://tilt-and-puff.vercel.app/og-image.png" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
